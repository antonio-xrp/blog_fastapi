services:
  # Servicio de base de datos
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servicio de la API
  api:
    build:
      context: .
      dockerfile: dockerfile

    restart: unless-stopped

    ports:
      - "8000:80"

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-blog_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fastapi_blog}"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

